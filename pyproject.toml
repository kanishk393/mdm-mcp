[project]
name = "mdm-mcp"
version = "0.1.0"
description = "Master data management MCP server: conversational datasets, columns, and rows over local JSON storage"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0,<2",
    "pydantic>=2.7",
    "rapidfuzz>=3.0",
]

[project.scripts]
mdm-mcp = "mdm_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mdm_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
